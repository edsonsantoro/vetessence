# AgroVerde — Stack do fork VetEssence (Docker)
#
# Imagem: serversideup/php:8.4-fpm-nginx (Nginx embutido, otimizada para Laravel)
# Configurações de performance baseadas em docs/performance.md
#
# ── Topologia de deployment ────────────────────────────────────────────────
# Não há porta publicada no host. O acesso chega pelo nginx compartilhado
# (container `wp-nginx`), que faz proxy para `agroverde-vet-app:8080` na rede
# externa `wordpress_wp-network`. Isso elimina risco de colisão de portas com
# os demais serviços da VPS e deixa o nginx resolvendo por DNS.
#
# Espera HTTP por dentro: nginx embutido do container -> 8080
# Acesso externo: https://vet.delsantoro.com.br (vhost vet.conf no wp-nginx)
#
# ── Sablier ────────────────────────────────────────────────────────────────
# Os 5 containers carregam `sablier.group=agroverde-vet`. O Sablier acorda e
# adormece o grupo inteiro; a sessão dura 2h (definida no vhost, via
# `session_duration=2h`). Enquanto dorme, consome zero.
#
# Uso:
#   docker compose up -d          # subir
#   docker compose logs -f app    # logs
#   docker compose exec app bash  # shell
#   docker compose down           # parar
#
# Ver docker/README.md para detalhes.

# ---------------------------------------------------------------------------
# Configurações reutilizáveis (YAML anchors)
# ---------------------------------------------------------------------------

# Logging: rotação por container.
# Mais restritivo que o global do daemon (50m×3) para limitar o disco.
# 10 MB × 3 arquivos × compressão ≈ 10-15 MB efetivos por container.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  # ---------------------------------------------------------------------------
  # Aplicação (PHP 8.4 FPM + Nginx)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: agroverde/php:8.4
    # NOME IMPORTANTE: `agroverde-app` pertence ao middleware de webhooks
    # (~/projects/agroverde/middleware). Nunca reutilizar.
    container_name: agroverde-vet-app
    # Sem `ports:` — o acesso vem pelo nginx compartilhado via DNS de rede.
    volumes:
      - .:/var/www/html
      - ./docker/php/99-agroverde.ini:/usr/local/etc/php/conf.d/99-agroverde.ini:ro
    environment:
      # --- Laravel ---
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://vet.delsantoro.com.br}"
      # O nginx compartilhado é o proxy de entrada; Laravel precisa confiar nele
      # para montar https:// e o IP real do visitante.
      TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      # Logging: canal 'daily' rotaciona automaticamente (14 dias)
      LOG_CHANNEL: "${LOG_CHANNEL:-daily}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      # --- Autorun (migrations, storage link) ---
      # Desabilitado por padrão: o vendor/ precisa existir primeiro.
      # O setup.sh roda composer install e depois habilita.
      AUTORUN_ENABLED: "${AUTORUN_ENABLED:-false}"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "false"
      AUTORUN_LARAVEL_ROUTE_CACHE: "false"
      AUTORUN_LARAVEL_VIEW_CACHE: "false"
      # --- Performance (docs/performance.md) ---
      PHP_OPCACHE_ENABLE: "1"
      PHP_MEMORY_LIMIT: "256M"
      PHP_MAX_EXECUTION_TIME: "300"
      PHP_POST_MAX_SIZE: "64M"
      PHP_UPLOAD_MAX_FILE_SIZE: "64M"
      # --- Banco ---
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-vetessence}"
      DB_USERNAME: "${DB_USERNAME:-vetessence}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      # --- Cache / Queue / Session ---
      CACHE_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      SESSION_DRIVER: "redis"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      # --- Mail ---
      MAIL_MAILER: "smtp"
      MAIL_HOST: "mailpit"
      MAIL_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      # Rede interna do stack (app <-> db/redis/mailpit).
      agroverde:
      # Rede externa compartilhada: é por ela que o wp-nginx alcança o app.
      shared:
        aliases:
          - agroverde-vet-app
    labels:
      sablier.enable: "true"
      sablier.group: "agroverde-vet"
    restart: unless-stopped
    # --- Limites de recursos ---
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    # --- Logging ---
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Banco de Dados (MariaDB 10.11 — mesma versão do docs/performance.md)
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: agroverde-vet-db
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-vetessence}"
      MARIADB_USER: "${DB_USERNAME:-vetessence}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-secret}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/99-agroverde.cnf:/etc/mysql/conf.d/99-agroverde.cnf:ro
    # Sem porta no host: 3306 belongs ao stack do WordPress. O acesso ao banco
    # é feito por dentro da rede: `docker compose exec db mariadb -u...`.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agroverde
    labels:
      sablier.enable: "true"
      sablier.group: "agroverde-vet"
    restart: unless-stopped
    # --- Limites de recursos ---
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    # --- Logging ---
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis (cache, queue, session)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agroverde-vet-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Sem porta no host: 6379 também é usado por wp-redis.
    # Healthcheck existe para o Sablier: sem ele o Sablier não sabe quando o
    # container está pronto e pode liberar a request antes do redis aceitar
    # conexões (loga "container running without healthcheck").
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - agroverde
    labels:
      sablier.enable: "true"
      sablier.group: "agroverde-vet"
    restart: unless-stopped
    # --- Limites de recursos ---
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    # --- Logging ---
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Mailpit (captura de e-mails em desenvolvimento)
  # UI: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit
    container_name: agroverde-vet-mailpit
    # Sem portas no host (8025/1025 já ocupados). UI acessível por dentro:
    #   docker compose exec mailpit wget -qO- http://127.0.0.1:8025 > /dev/null
    networks:
      - agroverde
    labels:
      sablier.enable: "true"
      sablier.group: "agroverde-vet"
    restart: unless-stopped
    # --- Limites de recursos ---
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    # --- Logging ---
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Queue Worker (processa jobs em background)
  # ---------------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: agroverde/php:8.4
    container_name: agroverde-vet-queue
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    # Healthcheck desabilitado: a imagem base espera PHP-FPM, mas este
    # container roda apenas o worker de filas (sem webserver).
    healthcheck:
      disable: true
    volumes:
      - .:/var/www/html
      - ./docker/php/99-agroverde.ini:/usr/local/etc/php/conf.d/99-agroverde.ini:ro
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://vet.delsantoro.com.br}"
      LOG_CHANNEL: "${LOG_CHANNEL:-daily}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_DATABASE: "${DB_DATABASE:-vetessence}"
      DB_USERNAME: "${DB_USERNAME:-vetessence}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      SESSION_DRIVER: "redis"
      REDIS_HOST: "redis"
      PHP_OPCACHE_ENABLE: "1"
      PHP_MEMORY_LIMIT: "256M"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      agroverde:
      shared:
        aliases:
          - agroverde-vet-queue
    labels:
      sablier.enable: "true"
      sablier.group: "agroverde-vet"
    restart: unless-stopped
    # --- Limites de recursos ---
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    # --- Logging ---
    logging: *default-logging

volumes:
  db_data:
  redis_data:

networks:
  # Rede interna do stack — app fala com db/redis/mailpit por aqui.
  agroverde:
    driver: bridge
  # Rede compartilhada da VPS (mesma do wp-nginx, sablier, middleware, penpot).
  shared:
    name: wordpress_wp-network
    external: true
