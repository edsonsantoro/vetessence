; ---------------------------------------------------------------------------
; AgroVerde — Configuração PHP
; Baseado em docs/performance.md (guia de otimização do VetEssence)
; ---------------------------------------------------------------------------

; --- Limites ---
memory_limit = 256M
max_execution_time = 300
max_input_time = 60
post_max_size = 64M
upload_max_filesize = 64M

; --- OPcache (maior impacto em performance) ---
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1

; --- Timezone ---
; AgroVerde: a clínica fica em Sinop-MT, que opera em hora de Manaus
; (UTC-4). Usar São Paulo (UTC-3) deslocaria toda data de agendamento em
; uma hora. Confirmar com config/app.php (que é a fonte que o Laravel usa).
date.timezone = America/Manaus

; --- Uploads ---
file_uploads = On
max_file_uploads = 20

; --- Sessão ---
session.gc_maxlifetime = 7200
